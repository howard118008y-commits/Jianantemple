<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="問事">
  <g fill="none" stroke="#f1d990" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 上方光圈（神明降臨）-->
    <circle cx="60" cy="32" r="14"/>
    <!-- 中央光點 -->
    <circle cx="60" cy="32" r="3" fill="#f1d990"/>
    <!-- 放射光芒 -->
    <path d="M60 14 L 60 8"/>
    <path d="M76 18 L 80 14"/>
    <path d="M82 30 L 88 30"/>
    <path d="M76 46 L 80 50"/>
    <path d="M44 18 L 40 14"/>
    <path d="M38 30 L 32 30"/>
    <path d="M44 46 L 40 50"/>
    <!-- 下方降乩光柱 -->
    <path d="M52 50 L 48 88"/>
    <path d="M68 50 L 72 88"/>
    <!-- 中間符（代表「問」）-->
    <rect x="50" y="58" width="20" height="32"/>
    <!-- 符上的字（簡化） -->
    <path d="M55 66 L 65 66"/>
    <path d="M60 62 L 60 78"/>
    <path d="M55 74 L 65 74"/>
    <!-- 信眾雙手合十（底部）-->
    <path d="M60 92 L 60 104"/>
    <path d="M52 96 L 60 92 L 68 96"/>
    <path d="M48 110 Q 60 100 72 110"/>
    <!-- 兩側裝飾光點 -->
    <circle cx="20" cy="60" r="1.4" fill="#f1d990"/>
    <circle cx="100" cy="60" r="1.4" fill="#f1d990"/>
    <circle cx="22" cy="78" r="1" fill="#f1d990"/>
    <circle cx="98" cy="78" r="1" fill="#f1d990"/>
  </g>
</svg>
