<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="天干地支">
  <g fill="none" stroke="#f1d990" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 八卦圓盤 outer ring -->
    <circle cx="60" cy="60" r="50"/>
    <circle cx="60" cy="60" r="42"/>
    <!-- 12 地支 tick marks (every 30°) -->
    <g stroke-width="2.5">
      <line x1="60" y1="10" x2="60" y2="18"/>
      <line x1="85" y1="17" x2="80" y2="24"/>
      <line x1="103" y1="35" x2="96" y2="40"/>
      <line x1="110" y1="60" x2="102" y2="60"/>
      <line x1="103" y1="85" x2="96" y2="80"/>
      <line x1="85" y1="103" x2="80" y2="96"/>
      <line x1="60" y1="110" x2="60" y2="102"/>
      <line x1="35" y1="103" x2="40" y2="96"/>
      <line x1="17" y1="85" x2="24" y2="80"/>
      <line x1="10" y1="60" x2="18" y2="60"/>
      <line x1="17" y1="35" x2="24" y2="40"/>
      <line x1="35" y1="17" x2="40" y2="24"/>
    </g>
    <!-- 太極（陰陽）in center -->
    <circle cx="60" cy="60" r="22"/>
    <path d="M60 38 Q 71 38 71 49 Q 71 60 60 60 Q 49 60 49 71 Q 49 82 60 82"/>
    <!-- 陰陽 small circles -->
    <circle cx="60" cy="49" r="2.5" fill="#f1d990"/>
    <circle cx="60" cy="71" r="2.5"/>
    <!-- decorative 4 corner direction marks -->
    <path d="M60 14 L 56 6 L 64 6 Z" fill="#f1d990"/>
  </g>
</svg>
