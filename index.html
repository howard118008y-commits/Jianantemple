  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-home">

  <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto">

  </video>
  <div class="bg-overlay"></div>

  <button id="playFallback" class="play-fallback" hidden aria-label="播放背景影片">

  </button>

  <header class="site-header">
    <a class="brand" href="index.html" onclick="if(history.length>1){history.back();return false}" aria-label="返回上一頁" title="返回上一頁">
      <div class="brand-name-zh">台北建安宮</div>
      <div class="brand-name-sub">艋舺雙園聖母會</div>
    </a>
    <nav class="site-nav">
      <a href="index.html" class="active">首 頁</a>
      <a href="about.html">關於建安宮</a>
      <a href="deities.html">神 明</a>

    </nav>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <div class="hero-tagline">天上聖母 ・ 護佑萬華</div>
      <h1 class="hero-title">台北建安宮</h1>
      <div class="hero-subtitle">艋舺雙園聖母會</div>
      <p class="hero-desc">
        承嘉義東石笨港口港口宮分靈，<br>
        自南部北上服務台北萬華已逾四十載。<br>
        本宮主祀天上聖母，<br>
        為地方信眾祈福消災、護國佑民。

      <div class="hero-cta">
        <a href="about.html" class="btn btn-primary">認識建安宮</a>
        <a href="https://www.facebook.com/TaipeiJianGong/" target="_blank" rel="noopener" class="btn btn-secondary">追蹤粉絲專頁</a>

  </main>

  <a href="about.html#news" class="hero-notice">
    <span class="notice-pulse"></span>
    <span class="notice-label">最 新</span>
    <span class="notice-text">天上聖母聖誕千秋 ・ 5/9 農曆三月廿三 ・ 即將舉辦</span>
    <span class="notice-arrow">→</span>

  <section class="info-strip">
    <div class="info-item">
      <div class="info-label">廟 址</div>
      <div class="info-value">台北市萬華區德昌街132巷1號1樓</div>
    </div>
    <div class="info-item">
      <div class="info-label">聯 絡 電 話</div>
      <div class="info-value">0981-142-292</div>
    </div>
    <div class="info-item">
      <div class="info-label">主 祀 神 明</div>
      <div class="info-value">天上聖母</div>
    </div>
  </section>

  <script>
    (function () {
      const v = document.getElementById('bgVideo');
      const fb = document.getElementById('playFallback');
      const tryPlay = () => {
        const p = v.play();
        if (p && typeof p.then === 'function') {
          p.then(() => { fb.hidden = true; })
           .catch(() => { fb.hidden = false; });
        }
      };
      v.addEventListener('loadeddata', tryPlay);
      v.addEventListener('error', () => console.error('背景影片載入失敗', v.error));
      fb.addEventListener('click', () => { v.muted = true; tryPlay(); });
      window.addEventListener('load', tryPlay);
    })();
  </script>
</body>
</html>
